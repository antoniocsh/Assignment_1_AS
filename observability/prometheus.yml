global:
  scrape_interval: 5s

scrape_configs:
  # Scrape nopCommerce app metrics (if Prometheus exporter is enabled)
  - job_name: 'nopcommerce'
    static_configs:
      - targets: ['nopcommerce_web:80']

  # Scrape otel-collector (exporter)
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  # Scrape Jaeger's internal metrics
  - job_name: 'jaeger'
    static_configs:
      - targets: ['jaeger:14269']
